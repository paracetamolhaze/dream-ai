# DREAM AI — full stack. `docker compose up -d --build`
# Local development of infra only: `docker compose up -d postgres redis minio`

name: dream-ai

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_NAME: ${APP_NAME:-DREAM AI}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL in .env}
  INTERNAL_APP_URL: http://web:3000
  DATABASE_URL: postgres://${POSTGRES_USER:-dream}:${POSTGRES_PASSWORD:-dream}@postgres:5432/${POSTGRES_DB:-dream}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-dream-media}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dreamminio}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dreamminio-secret}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  MEDIA_DELIVERY: ${MEDIA_DELIVERY:-proxy}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_MINIAPP_SHORT_NAME: ${TELEGRAM_MINIAPP_SHORT_NAME:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-/telegram/webhook}
  TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
  TELEGRAM_CHANNEL_URL: ${TELEGRAM_CHANNEL_URL:-}
  SUPPORT_CHAT_ID: ${SUPPORT_CHAT_ID:-}
  BOT_MODE: ${BOT_MODE:-webhook}
  ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
  ADMIN_TIMEZONE: ${ADMIN_TIMEZONE:-Europe/Moscow}
  MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
  ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-false}
  DEMO_MODE: ${DEMO_MODE:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  STT_API_KEY: ${STT_API_KEY:-}
  STT_BASE_URL: ${STT_BASE_URL:-}
  LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
  LLM_OPENAI_BASE_URL: ${LLM_OPENAI_BASE_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  FAL_KEY: ${FAL_KEY:-}
  REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
  RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
  IMAGE_OPENAI_API_KEY: ${IMAGE_OPENAI_API_KEY:-}
  IMAGE_OPENAI_BASE_URL: ${IMAGE_OPENAI_BASE_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dream}
      POSTGRES_DB: ${POSTGRES_DB:-dream}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dream} -d ${POSTGRES_DB:-dream}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence: queued jobs survive restarts. noeviction is required by BullMQ.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO no longer publishes images on Docker Hub; Bitnami's MinIO build is used by default.
    # Override with MINIO_IMAGE (any S3-compatible server works — the app only speaks S3).
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2025.7.23}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dreamminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dreamminio-secret}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-dream-media}
      MINIO_SKIP_CLIENT: "no"
    volumes:
      - miniodata:/bitnami/minio/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: .
      target: worker
    command: ["node", "dist/migrate.js"]
    environment:
      <<: *app-env
      MIGRATIONS_DIR: /app/apps/worker/drizzle
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: "no"
    profiles: ["app"]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles: ["app"]

  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    environment:
      <<: *app-env
      BOT_PORT: "8081"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles: ["app"]

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      WORK_DIR: /tmp/dream-work
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    profiles: ["app"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web: { condition: service_healthy }
    profiles: ["app"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
